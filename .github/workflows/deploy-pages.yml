name: Deploy to GitHub Pages

# Publishes the app to https://anpark101.github.io/for-au/.
# Repository → Settings → Pages → Source must be "GitHub Actions"; the github-pages
# environment also only allows deployments from the default branch, so this workflow
# lives on main and every push there rebuilds and republishes.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Pages is not enabled yet
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice title=One tap needed::GitHub Pages is not enabled for this repository."
          echo "Open Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow."
          echo "The production build in dist/ is ready; nothing else is missing."

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
