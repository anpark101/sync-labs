name: Deploy to GitHub Pages

# Publishes the app to https://anpark101.github.io/for-au/ once two things are true:
#   1. Repository → Settings → Pages → Build and deployment → Source: GitHub Actions
#   2. This workflow file exists on the default branch (main) — the github-pages
#      environment only allows deployments from main.
# From then on, every push to main rebuilds and republishes automatically.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Pages is not enabled yet
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice title=One tap needed::GitHub Pages is not enabled for this repository."
          echo "Open Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow."
          echo "The production build in dist/ is ready; nothing else is missing."

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
